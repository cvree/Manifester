<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Manifester — calm affirmation loops</title>
    <meta
      name="description"
      content="Paste an intention, choose a voice, and let it loop over gentle ambient sound. Private by design — everything stays on your device."
    />

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <meta name="theme-color" content="#EFE7DC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171423" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS standalone / add-to-home-screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Manifester" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Manifester — calm affirmation loops" />
    <meta
      property="og:description"
      content="A tiny calm garden for your intentions. Paste text, pick a voice, press play."
    />

    <script>
      // Set the theme and the palette's hue before first paint, so there is
      // neither a light/dark flash nor a moment of the wrong colour.
      (function () {
        var root = document.documentElement
        root.classList.remove('no-js')
        try {
          var stored = localStorage.getItem('manifester:theme')
          var dark =
            stored === 'night' ||
            (stored !== 'day' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) root.classList.add('dark')

          var hue = parseInt(localStorage.getItem('manifester:hue'), 10)
          if (hue) root.style.setProperty('--hue-shift', String(hue))
        } catch (e) {
          /* private mode — fall back to the light theme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui; padding: 2rem; text-align: center">
        Manifester needs JavaScript to read your words aloud. Please enable it
        and reload.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
