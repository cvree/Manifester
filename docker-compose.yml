# Manifester with its own voice.
#
#     docker compose up
#     → the whole app on http://localhost:8787
#
# Two services. `kokoro` is the model, exactly as its authors publish it;
# `api` is this repository's small Node server, which is the only thing that
# can talk to it.
#
# Note what `kokoro` does *not* have: a `ports:` entry. It is reachable from
# `api` over the internal network and from nowhere else — not from a browser,
# not from the host, not from the internet if this is deployed to a server.
# That is deliberate and it is the main security property of the whole design:
# an open text-to-speech endpoint is an open invitation to spend somebody
# else's CPU, and the way to be certain it is not exposed is for there to be no
# port to expose it on.

services:
  kokoro:
    # The CPU build, on purpose: no GPU, no CUDA, no drivers, and it keeps up
    # comfortably with one person listening. Swap the tag for
    # `kokoro-fastapi-gpu` and add a `deploy.resources.reservations.devices`
    # block if there is a card to use.
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    restart: unless-stopped
    expose:
      - '8880'
    environment:
      # Kokoro's own defaults, stated so they are visible rather than implied.
      - PYTHONUNBUFFERED=1
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=3)\""
      interval: 15s
      timeout: 5s
      # The first load pulls the model into memory and is not quick on a CPU.
      start_period: 180s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-8787}:8787'
    environment:
      KOKORO_URL: http://kokoro:8880
      SPEECH_CACHE_DIR: /data/speech
      PUBLIC_DIR: /app/dist
      # Everything generated by `npm run speech` on the host, served read-only.
      SPEECH_STATIC_DIR: /app/speech-static
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
    volumes:
      # Synthesised clips survive a rebuild. They are content-addressed, so
      # this cache can never go stale — only unused.
      - speech-cache:/data/speech
      - ./public/speech:/app/speech-static:ro
    depends_on:
      kokoro:
        condition: service_started

volumes:
  speech-cache:
