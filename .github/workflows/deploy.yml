name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-flight run finish rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        # There is no speech backend behind GitHub Pages, and saying so is
        # better than letting the app discover it: an empty endpoint means the
        # page never makes a request that can only 404, plays whatever
        # `npm run speech` committed under `public/speech`, and uses the
        # device's own voice for anything else. See `src/lib/tts/config.ts`.
        env:
          VITE_TTS_ENDPOINT: ''
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The default is ten minutes, and a deploy has already been lost to
          # it: the build was fine and the upload was fine, but GitHub's own
          # CDN sat in `purging_cdn` past the deadline, so the action cancelled
          # a perfectly good deployment and the site silently stayed on the
          # previous build. Nothing here can make the purge faster; twenty
          # minutes just means waiting it out instead of throwing it away.
          timeout: 1200000
