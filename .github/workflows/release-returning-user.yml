name: Verify and ship returning-user release

on:
  push:
    branches: [release/returning-user-final]
    paths:
      - .github/workflows/release-returning-user.yml

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  verify-and-ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/returning-user-final
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Finish the implementation if the apply job has not yet done so
        run: |
          set -euo pipefail
          if [ ! -f src/lib/listening.ts ]; then
            if compgen -G 'scripts/apply-returning-user.part*' > /dev/null; then
              cat scripts/apply-returning-user.part* | base64 --decode | gunzip > /tmp/apply-returning-user.mjs
              node /tmp/apply-returning-user.mjs
              if [ -f scripts/fix-returning-user-tests.mjs ]; then
                node scripts/fix-returning-user-tests.mjs
              fi
            elif [ -f scripts/apply-returning-user.mjs ]; then
              node scripts/apply-returning-user.mjs
            else
              echo "Returning-user implementation payload is missing." >&2
              exit 1
            fi
          fi

          rm -f \
            scripts/apply-returning-user.mjs \
            scripts/apply-returning-user.mjs.gz \
            scripts/apply-returning-user.part* \
            scripts/fix-returning-user-tests.mjs \
            .github/typecheck-diagnostic.txt \
            .github/workflows/apply-returning-user.yml

          python3 - <<'PY'
          from pathlib import Path
          for filename in ('.github/workflows/deploy.yml', '.github/workflows/quality.yml'):
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text()
              header = text.split('\njobs:', 1)[0]
              if 'workflow_dispatch:' not in header:
                  text = text.replace('on:\n  push:', 'on:\n  workflow_dispatch:\n  push:', 1)
                  path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Whitespace check
        run: git diff --check

      - name: Unit and integration tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Production preview smoke check
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/manifester-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/Manifester/ > /tmp/manifester.html; then
              break
            fi
            sleep 1
          done
          grep -q '<div id="root"></div>' /tmp/manifester.html

      - name: Confirm the release surface
        run: |
          test -f src/routes/LaunchRoute.tsx
          test -f src/routes/SharedLoopRoute.tsx
          test -f src/components/LibraryBackupPanel.tsx
          test -f src/components/ReminderPanel.tsx
          test -f src/lib/listening.ts
          test -f src/lib/sessionClock.ts
          test -f src/lib/share.ts
          test -f src/lib/backup.ts
          test ! -f .github/workflows/apply-returning-user.yml
          test ! -f scripts/fix-returning-user-tests.mjs
          test ! -f .github/typecheck-diagnostic.txt
          if find scripts -maxdepth 1 -name 'apply-returning-user*' -print -quit | grep -q .; then
            echo "Temporary apply files remain." >&2
            exit 1
          fi

      - name: Commit the verified product and fast-forward main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "cvree"
          git config user.email "iscvree@gmail.com"
          rm -f .github/workflows/release-returning-user.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Make returning sessions effortless and calm"
          fi

          git push origin HEAD:release/returning-user-final
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
          echo "MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch and verify the production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dispatched=0
          for attempt in {1..12}; do
            if gh workflow run deploy.yml --ref main; then
              dispatched=1
              break
            fi
            sleep 5
          done
          test "$dispatched" -eq 1

          run_id=""
          for attempt in {1..24}; do
            run_id=$(gh run list \
              --workflow deploy.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${MAIN_SHA}\") | .databaseId" \
              | head -n 1)
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status
