name: Materialize verified returning-user release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-returning-user.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply returning-user release
        run: |
          set -euo pipefail
          cat scripts/apply-returning-user.part* | base64 --decode | gunzip > /tmp/apply-returning-user.mjs
          node /tmp/apply-returning-user.mjs
          if [ -f scripts/fix-returning-user-tests.mjs ]; then
            node scripts/fix-returning-user-tests.mjs
          fi

          rm -f \
            scripts/apply-returning-user.mjs \
            scripts/apply-returning-user.mjs.gz \
            scripts/apply-returning-user.part* \
            scripts/fix-returning-user-tests.mjs

          # Materialize product source only. Workflow cleanup is performed by
          # the authenticated release client after this commit is attached to
          # main, avoiding GitHub's special workflow-token restrictions.
          git checkout HEAD -- .github

      - name: Install dependencies
        run: npm ci

      - name: Whitespace check
        run: git diff --check

      - name: Unit and integration tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Production preview smoke check
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/manifester-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/Manifester/ > /tmp/manifester.html; then
              break
            fi
            sleep 1
          done
          grep -q '<div id="root"></div>' /tmp/manifester.html

      - name: Confirm product release surface
        run: |
          test -f src/routes/LaunchRoute.tsx
          test -f src/routes/SharedLoopRoute.tsx
          test -f src/components/LibraryBackupPanel.tsx
          test -f src/components/ReminderPanel.tsx
          test -f src/lib/listening.ts
          test -f src/lib/sessionClock.ts
          test -f src/lib/share.ts
          test -f src/lib/backup.ts
          test ! -f scripts/fix-returning-user-tests.mjs
          if find scripts -maxdepth 1 -name 'apply-returning-user*' -print -quit | grep -q .; then
            echo "Temporary apply files remain." >&2
            exit 1
          fi

      - name: Create verified product commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A
          base_tree=$(git rev-parse HEAD^{tree})
          printf '{"base_tree":"%s","tree":[' "$base_tree" > /tmp/tree.json
          first=1

          while IFS= read -r -d '' path; do
            payload=$(base64 -w0 "$path" | jq -Rs '{content:., encoding:"base64"}')
            if ! response=$(printf '%s' "$payload" | gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST --input - 2>&1); then
              echo "::error title=BLOB_CREATE_FAILED::${path}: ${response}"
              exit 1
            fi
            blob=$(printf '%s' "$response" | jq -r .sha)
            if [ "$first" -eq 0 ]; then printf ',' >> /tmp/tree.json; fi
            first=0
            jq -cn --arg path "$path" --arg sha "$blob" '{path:$path,mode:"100644",type:"blob",sha:$sha}' >> /tmp/tree.json
          done < <(git diff --cached --name-only --diff-filter=ACMRTUXB -z)

          while IFS= read -r -d '' path; do
            if [ "$first" -eq 0 ]; then printf ',' >> /tmp/tree.json; fi
            first=0
            jq -cn --arg path "$path" '{path:$path,mode:"100644",type:"blob",sha:null}' >> /tmp/tree.json
          done < <(git diff --cached --name-only --diff-filter=D -z)

          printf ']}' >> /tmp/tree.json
          if ! tree_response=$(gh api "repos/${GITHUB_REPOSITORY}/git/trees" --method POST --input /tmp/tree.json 2>&1); then
            echo "::error title=TREE_CREATE_FAILED::${tree_response}"
            exit 1
          fi
          tree_sha=$(printf '%s' "$tree_response" | jq -r .sha)

          jq -n \
            --arg message 'Make returning sessions effortless and calm' \
            --arg tree "$tree_sha" \
            --arg parent "$GITHUB_SHA" \
            '{message:$message,tree:$tree,parents:[$parent]}' > /tmp/commit.json
          if ! commit_response=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits" --method POST --input /tmp/commit.json 2>&1); then
            echo "::error title=COMMIT_CREATE_FAILED::${commit_response}"
            exit 1
          fi
          commit_sha=$(printf '%s' "$commit_response" | jq -r .sha)
          echo "::notice title=FINAL_COMMIT_SHA::${commit_sha}"
