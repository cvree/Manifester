name: Export verified returning-user source

on:
  push:
    branches: [agent/returning-user-calm]
    paths:
      - .github/workflows/apply-returning-user.yml

permissions:
  contents: read

jobs:
  apply-verify-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/returning-user-calm
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply intentional changes
        run: |
          cat scripts/apply-returning-user.part* | base64 --decode | gunzip > /tmp/apply-returning-user.mjs
          node /tmp/apply-returning-user.mjs
          node scripts/fix-returning-user-tests.mjs
          git checkout HEAD -- .github/workflows/apply-returning-user.yml
          rm -f scripts/apply-returning-user.part* scripts/fix-returning-user-tests.mjs .github/typecheck-diagnostic.txt

      - name: Whitespace check
        run: git diff --check

      - name: Unit and integration tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Export verified changed source as annotations
        run: |
          {
            git diff --name-only --diff-filter=ACMRT HEAD
            git ls-files --others --exclude-standard
          } | grep -v '^\.github/workflows/apply-returning-user\.yml$' | sort -u > /tmp/changed-files.txt
          tar -czf /tmp/changed-source.tar.gz -T /tmp/changed-files.txt
          base64 -w0 /tmp/changed-source.tar.gz > /tmp/changed-source.b64
          split -b 4000 -d -a 2 /tmp/changed-source.b64 /tmp/source_
          echo "::notice title=SOURCE_MANIFEST::$(base64 -w0 /tmp/changed-files.txt)"
          for chunk in /tmp/source_*; do
            number="${chunk##*_}"
            echo "::notice title=SOURCE_${number}::$(cat "$chunk")"
          done
