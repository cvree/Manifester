name: Apply returning-user release

on:
  push:
    branches: [agent/returning-user-calm]
    paths:
      - scripts/apply-returning-user.part*
      - scripts/fix-returning-user-tests.mjs
      - .github/workflows/apply-returning-user.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/returning-user-calm
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply intentional changes
        run: |
          cat scripts/apply-returning-user.part* | base64 --decode | gunzip > /tmp/apply-returning-user.mjs
          node /tmp/apply-returning-user.mjs
          node scripts/fix-returning-user-tests.mjs
          rm -f scripts/apply-returning-user.part* scripts/fix-returning-user-tests.mjs .github/workflows/apply-returning-user.yml

      - name: Whitespace check
        run: git diff --check

      - name: Unit and integration tests
        run: npm test

      - name: Type check
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          cat /tmp/typecheck.log
          if [ $status -ne 0 ]; then
            grep -E 'error TS|error:' /tmp/typecheck.log | head -100 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $status

      - name: Production build
        run: npm run build

      - name: Commit verified release
        run: |
          git config user.name "cvree"
          git config user.email "iscvree@gmail.com"
          git add -A
          git commit -m "Make returning sessions effortless and calm"
          git push origin HEAD:agent/returning-user-calm
