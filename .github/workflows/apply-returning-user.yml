name: Apply returning-user release

on:
  push:
    branches: [agent/returning-user-calm]
    paths:
      - .github/workflows/apply-returning-user.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/returning-user-calm
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply intentional changes
        run: |
          cat scripts/apply-returning-user.part* | base64 --decode | gunzip > /tmp/apply-returning-user.mjs
          node /tmp/apply-returning-user.mjs
          node scripts/fix-returning-user-tests.mjs
          git checkout HEAD -- .github/workflows/apply-returning-user.yml
          rm -f scripts/apply-returning-user.part* scripts/fix-returning-user-tests.mjs .github/typecheck-diagnostic.txt

      - name: Whitespace check
        run: git diff --check

      - name: Unit and integration tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit verified release locally
        run: |
          git config user.name "cvree"
          git config user.email "iscvree@gmail.com"
          git status --short
          git add -A
          git commit -m "Make returning sessions effortless and calm"

      - name: Push verified release
        run: git push origin HEAD:agent/returning-user-calm
