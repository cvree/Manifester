name: Export verified returning-user patch

on:
  push:
    branches: [agent/returning-user-calm]
    paths:
      - .github/workflows/apply-returning-user.yml

permissions:
  contents: read

jobs:
  apply-verify-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/returning-user-calm
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply intentional changes
        run: |
          cat scripts/apply-returning-user.part* | base64 --decode | gunzip > /tmp/apply-returning-user.mjs
          node /tmp/apply-returning-user.mjs
          node scripts/fix-returning-user-tests.mjs
          git checkout HEAD -- .github/workflows/apply-returning-user.yml
          rm -f scripts/apply-returning-user.part* scripts/fix-returning-user-tests.mjs .github/typecheck-diagnostic.txt

      - name: Whitespace check
        run: git diff --check

      - name: Unit and integration tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Export compressed patch as annotations
        run: |
          git diff --binary HEAD > /tmp/returning-user.patch
          gzip -c -9 /tmp/returning-user.patch | base64 -w0 > /tmp/returning-user.patch.b64
          split -b 4000 -d -a 2 /tmp/returning-user.patch.b64 /tmp/patch_
          for chunk in /tmp/patch_*; do
            number="${chunk##*_}"
            echo "::notice title=PATCH_${number}::$(cat "$chunk")"
          done
