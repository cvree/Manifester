name: Build returning-user source artifact

on:
  push:
    branches: [agent/returning-user-calm]
    paths:
      - .github/workflows/apply-returning-user.yml

permissions:
  contents: read

jobs:
  apply-verify-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/returning-user-calm
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply intentional changes
        run: |
          cat scripts/apply-returning-user.part* | base64 --decode | gunzip > /tmp/apply-returning-user.mjs
          node /tmp/apply-returning-user.mjs
          node scripts/fix-returning-user-tests.mjs
          git checkout HEAD -- .github/workflows/apply-returning-user.yml
          rm -f scripts/apply-returning-user.part* scripts/fix-returning-user-tests.mjs .github/typecheck-diagnostic.txt

      - name: Whitespace check
        run: git diff --check

      - name: Unit and integration tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Package verified source
        run: |
          git diff --binary HEAD > /tmp/returning-user.patch
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/returning-user-source.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: returning-user-source
          path: |
            /tmp/returning-user-source.tar.gz
            /tmp/returning-user.patch
          if-no-files-found: error
          retention-days: 1
