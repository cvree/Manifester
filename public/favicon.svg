<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#F7F1E8"/>
      <stop offset="60%" stop-color="#E7E0F0"/>
      <stop offset="100%" stop-color="#DCD4E8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="46%">
      <stop offset="0%" stop-color="#C4818A" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#C4818A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0%" stop-color="#7F9D81"/>
      <stop offset="100%" stop-color="#A2BE9F"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <g transform="translate(0 0) scale(1)">
    <!-- crescent moon -->
    <path d="M330 96a112 112 0 1 0 74 196 92 92 0 1 1-74-196Z"
          fill="#CFA45F" opacity="0.9"/>

    <!-- seed -->
    <path d="M256 214c46 30 70 68 70 112a70 70 0 0 1-140 0c0-44 24-82 70-112Z"
          fill="#C4818A"/>
    <path d="M256 214c46 30 70 68 70 112a70 70 0 0 1-70 70V214Z"
          fill="#A5636D" opacity="0.55"/>

    <!-- stem and leaf -->
    <path d="M256 396v56" stroke="#2E3A59" stroke-width="13"
          stroke-linecap="round" opacity="0.55"/>
    <path d="M256 428c-24-4-40-20-44-46 26 2 42 18 44 46Z" fill="url(#leaf)"/>

    <!-- sparks -->
    <circle cx="140" cy="150" r="9" fill="#2E3A59" opacity="0.4"/>
    <circle cx="404" cy="392" r="7" fill="#2E3A59" opacity="0.32"/>
    <circle cx="112" cy="330" r="6" fill="#A5636D" opacity="0.45"/>
  </g>
</svg>